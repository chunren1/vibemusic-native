# CI: tag v* → 云端编译签名 → GitHub Release 发包
# 触发：git tag v1.0.x-ai && git push origin v1.0.x-ai
# Secrets（仓库 Settings → Secrets → Actions，需预置）：
#   KEYSTORE_FILE      base64 后的 release keystore
#   KEYSTORE_PASSWORD  keystore 密码（store/key 同密）
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发 Release 需要写权限（默认 GITHUB_TOKEN 只读）
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已下架废弃的 tools 包（2026-09-15 实锤 Failed to find package 'tools' 致整步 exit 1），只留 platform-tools
          packages: platform-tools

      - name: Restore keystore
        run: echo "$KEYSTORE_FILE" | base64 -d > /tmp/release.jks
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          VIBEMUSIC_KEYSTORE_PATH: /tmp/release.jks
          VIBEMUSIC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "VibeMusic-${TAG}-release.apk"
          echo "APK_NAME=VibeMusic-${TAG}-release.apk" >> "$GITHUB_ENV"

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 双通道：tag 含 beta（不分大小写）即测试版 → GitHub prerelease；
          # 正式 tag（如 v1.0.40-ai）保持正式 Release。更新器正式通道只读 /latest（自动排除 prerelease）。
          if printf '%s' "$TAG" | grep -qi 'beta'; then
            PRERELEASE_FLAGS="--prerelease"
            NOTES="VibeMusic 原生版 $TAG（测试版，CI 自动构建签名；正式通道收不到此版）"
          else
            PRERELEASE_FLAGS=""
            NOTES="VibeMusic 原生版 $TAG（CI 自动构建签名）"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" "$APK_NAME" \
              --title "$TAG" \
              --notes "$NOTES" \
              $PRERELEASE_FLAGS
          fi

      # Gitee 镜像：与 GitHub Release 同包。GitHub 是 source of truth，
      # 本步骤失败绝不影响整个 job（continue-on-error: true）。
      - name: Mirror to Gitee release
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          OWNER="green-leavesQAQ"
          REPO="vibemusic-native"
          API="https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases"
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::Gitee mirror skipped: GITEE_TOKEN secret is empty"
            exit 0
          fi
          if [ -z "${APK_NAME:-}" ] || [ ! -f "$APK_NAME" ]; then
            echo "::warning::Gitee mirror skipped: APK file $APK_NAME not found"
            exit 0
          fi
          NOTES="VibeMusic 原生版 $TAG（CI 自动构建签名，与 GitHub Release 同包）"
          if printf '%s' "$TAG" | grep -qi 'beta'; then
            NOTES="VibeMusic 原生版 $TAG（测试版，CI 自动构建签名，与 GitHub Release 同包）"
            PRERELEASE_JSON=',"prerelease":true'
          else
            PRERELEASE_JSON=',"prerelease":false'
          fi
          # (a) create release; 422 (already exists) → treat as success.
          CREATE_RESP=$(curl -sS --connect-timeout 10 --max-time 30 -w '\n%{http_code}' \
            -X POST "$API?access_token=${GITEE_TOKEN}" \
            -H "Content-Type: application/json;charset=UTF-8" \
            --data "$(TAG="$TAG" NOTES="$NOTES" PRE="$PRERELEASE_JSON" python3 -c 'import json,os;d={"tag_name":os.environ["TAG"],"name":os.environ["TAG"],"body":os.environ["NOTES"]};s=json.dumps(d);print(s[:-1]+os.environ["PRE"]+"}")')" \
            ) || CREATE_RESP=""
          CREATE_CODE=$(printf '%s' "$CREATE_RESP" | tail -n 1)
          CREATE_BODY=$(printf '%s' "$CREATE_RESP" | sed '$d')
          echo "Gitee create HTTP: ${CREATE_CODE:-curl-failed}"
          RELEASE_ID=$(printf '%s' "$CREATE_BODY" | python3 -c 'import json,sys;print(json.loads(sys.stdin.read() or "{}").get("id",""))' 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            # Create returned existing (422) or no id → GET list, find id by tag.
            LIST_JSON=$(curl -sS --connect-timeout 10 --max-time 30 \
              "${API}?access_token=${GITEE_TOKEN}&per_page=100" || echo "")
            RELEASE_ID=$(printf '%s' "$LIST_JSON" | TAG="$TAG" python3 -c \
              'import json,os,sys
          try:
              items=json.loads(sys.stdin.read() or "[]")
          except Exception:
              items=[]
          tag=os.environ.get("TAG","")
          print(next((str(r.get("id","")) for r in items if r.get("tag_name")==tag), ""))' || true)
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "::warning::Gitee mirror failed: no release id for tag $TAG (create HTTP ${CREATE_CODE:-?})"
            exit 0
          fi
          echo "Gitee release id: $RELEASE_ID"
          # (b) attach the SAME APK file.
          ATTACH_CODE=$(curl -sS --connect-timeout 10 --max-time 120 -o /tmp/gitee_attach.json -w '%{http_code}' \
            -X POST "${API}/${RELEASE_ID}/attach?access_token=${GITEE_TOKEN}" \
            -F "file=@${APK_NAME}" || echo "curl-failed")
          echo "Gitee attach HTTP: $ATTACH_CODE"
          case "$ATTACH_CODE" in
            200|201) echo "Gitee mirror OK: $TAG (release $RELEASE_ID)" ;;
            *) echo "::warning::Gitee attach failed for tag $TAG (HTTP $ATTACH_CODE)" ;;
          esac
          exit 0
