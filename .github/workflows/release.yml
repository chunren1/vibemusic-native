# CI: tag v* → 云端编译签名 → GitHub Release 发包
# 触发：git tag vX.Y.Z-ai && git push origin vX.Y.Z-ai（当前 v2.0.20-ai）
# Secrets（仓库 Settings → Secrets and variables → Actions → New repository secret，需预置；
#         缺 KEYSTORE_FILE / KEYSTORE_PASSWORD 任一 → 发版直接失败，不静默跳过）：
#   KEYSTORE_FILE          base64 后的 release keystore
#   KEYSTORE_PASSWORD      keystore 密码（store/key 同密）
#   SIGNING_CERT_SHA256    【可选】release 签名证书的 SHA-256 指纹覆盖值。证书指纹是公开信息
#                          （任何已发布 APK 都能用 apksigner 取到），默认值已固化在下方
#                          Verify APK 步骤的 env 里，**不配置本 secret 也能正常发版**。
#                          什么情况下要配：轮换 keystore 时不想改 workflow，可直接用 secret 覆盖。
#                          取值（本地，用同一把 release keystore 签个包后）：
#                             ~/Android/Sdk/build-tools/36.0.0/apksigner verify --print-certs \
#                               app/build/outputs/apk/release/app-release.apk | grep SHA-256
#                          取 "Signer #1 certificate SHA-256 digest:" 后面那 64 位 hex（带不带冒号、
#                          大小写都认，脚本会归一化）。当前发版证书指纹（公开信息，非密钥）：
#                             SHA-256 873ba7ca34e353b63493e677809a1e68face08d776953923b99faf46114dc4d8
#                             SHA-1   f942690ed457bc77f3021406ba77e3bdd07a9acb
#                          轮换 keystore 后必须同步更新「默认常量」或「本 secret」，否则发版会红
#                          （这是期望行为：宁可发不出去，也不发出错证书签的包）。
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    # 显式钉镜像：ubuntu-latest 自 2026-10-19 起迁 Ubuntu 26，发版链路（setup-android
    # + build-tools 35 + apksigner）只在 24.04 上验过，别被无声切换带走。
    runs-on: ubuntu-24.04
    permissions:
      contents: write # 发 Release 需要写权限（默认 GITHUB_TOKEN 只读）
    steps:
      - uses: actions/checkout@v7 # Node24；v5+ 的 breaking 只影响 pull_request_target，本 workflow 不用

      - name: Set up JDK 17
        uses: actions/setup-java@v6 # v4 已停止维护；v6 把 jdkFile 改名 jdk-file（本处未用）
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # 依赖+wrapper 缓存：tag 构建免重复下载（8 分钟发版的主要水分）

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4 # Node24 + 默认 cmdline-tools 20.0（需 JDK17+，本处满足）
        with:
          # Google 已下架废弃的 tools 包（2026-09-15 实锤 Failed to find package 'tools' 致整步 exit 1），只留 platform-tools
          packages: platform-tools,platforms;android-36,build-tools;36.0.0

      - name: Restore keystore
        run: echo "$KEYSTORE_FILE" | base64 -d > /tmp/release.jks
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}

      - name: Grant gradlew
        run: chmod +x gradlew

      # 封面兜底门禁（2026-09-28 立规：四轮补洞教训）：封面渲染一律走
      # coverModelOrDefault + error/fallback，裸调 coverModel() 直接红。
      # 匹配 coverModel( 后面不是 O 的调用（排除 coverModelOrDefault），
      # 再排除 fun 定义行自己。
      - name: Cover fallback gate
        run: |
          HITS=$(grep -rnE "coverModel\([^O]" app/src/main/java || true)
          HITS=$(printf '%s' "$HITS" | grep -vF "fun coverModel(" || true)
          if [ -n "$HITS" ]; then
            echo "::error::裸调 coverModel() 会造成无封面白板，必须换成 coverModelOrDefault + error/fallback"
            printf '%s\n' "$HITS"
            exit 1
          fi
          echo "cover fallback gate ✓"

      # R4-A4：发版前强制跑单测（验收门"单测全绿"由 CI 兜底，tag 直发不再无卡；失败即中止，避免白构建）
      - name: Unit tests (release gate)
        run: ./gradlew testDebugUnitTest --no-daemon
        env:
          VIBEMUSIC_KEYSTORE_PATH: /tmp/release.jks
          VIBEMUSIC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      # 静态检查门（2026-10-22 新增）：历史 80 errors / 50+ warnings 已快照进
      # app/lint-baseline.xml，`abortOnError = true` 保持 —— 旧债不阻塞，新增 error 立即红。
      # 注意：lintRelease 任务名含 "Release"，会命中 app/build.gradle.kts 里
      # wantsRelease 的 keystore 校验，所以必须像其它步骤一样带 keystore 环境变量。
      - name: Lint (release gate)
        run: ./gradlew --no-daemon lintRelease
        env:
          VIBEMUSIC_KEYSTORE_PATH: /tmp/release.jks
          VIBEMUSIC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          VIBEMUSIC_KEYSTORE_PATH: /tmp/release.jks
          VIBEMUSIC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "VibeMusic-${TAG}-release.apk"
          echo "APK_NAME=VibeMusic-${TAG}-release.apk" >> "$GITHUB_ENV"

      # 交付门（README 承诺）：证书指纹断言 + tag/源码/APK 版本一致 + versionCode 单调 + sha256
      # 2026-10-22 修：原步骤 `apksigner verify --print-certs | head -5` 只打印不比对，
      # 用错 keystore 签的包照样能发出去 → 现改为硬断言，不一致 exit 1。
      - name: Verify APK (signature + version + sha256)
        env:
          # 证书指纹本身不是秘密（任何已发布 APK 都能用 apksigner 取到），因此把当前发版证书
          # 固化在仓库里作为默认值；secret 仅用于「轮换 keystore 时临时覆盖」，不配置也能发版。
          # 轮换 keystore 后务必同步更新下面这行常量，否则 CI 会红（fail-closed 是有意的）。
          EXPECTED_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 || '873ba7ca34e353b63493e677809a1e68face08d776953923b99faf46114dc4d8' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="$APK_NAME"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          echo "── 1) 签名证书 SHA-256 断言 ──"
          if [ -z "${EXPECTED_CERT_SHA256:-}" ]; then
            echo "::error::secrets.SIGNING_CERT_SHA256 未配置：无法断言产物由发版证书签名，拒绝发布（取法见本文件顶部注释）"
            exit 1
          fi
          # 归一化期望值：去空白/冒号/连字符，转小写（容忍 aa:bb:.. 或大写写法）
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:-' | tr 'A-Z' 'a-z')
          if ! printf '%s' "$EXPECTED" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::secrets.SIGNING_CERT_SHA256 格式非法（需 64 位 hex，得到 ${#EXPECTED} 字符）"
            exit 1
          fi
          # 完整打印（不 head 截断，便于日后排障），apksigner 同时校验 APK 签名块完整性
          CERTS=$("$BT/apksigner" verify --print-certs "$APK")
          printf '%s\n' "$CERTS"
          # 只按「行内容」取摘要，不依赖 signer 前缀：build-tools 35 打 `Signer #1 certificate SHA-256 digest:`，
          # 新版本改打 `V2 Signer: certificate SHA-256 digest:`（2026-10-26 tag 发布实测因此误判「解析失败」）。
          DIGESTS=$(printf '%s\n' "$CERTS" \
            | sed -n 's/.*certificate SHA-256 digest: *//p' \
            | tr -d ' :\t\r-' | tr 'A-Z' 'a-z')
          # 去重后必须恰好 1 个：真意是「产物只由一把证书签」，而不是「apksigner 只打印一个 signer 块」
          # （同一把证书在 V1/V2/V3 各打一行是正常的）。
          SIGNERS=$(printf '%s\n' "$DIGESTS" | grep -c . || true)
          UNIQ_SIGNERS=$(printf '%s\n' "$DIGESTS" | sort -u | grep -c . || true)
          if [ "$SIGNERS" -lt 1 ] || [ "$UNIQ_SIGNERS" -ne 1 ]; then
            echo "::error::APK 签名证书不唯一（signer 行=${SIGNERS}，不同证书=${UNIQ_SIGNERS}，期望恰好 1 把）"
            exit 1
          fi
          ACTUAL=$(printf '%s\n' "$DIGESTS" | head -1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名证书不符：期望 SHA-256 ${EXPECTED}，实际 ${ACTUAL:-<解析失败>}；疑似用错 keystore，拒绝发布"
            exit 1
          fi
          echo "certificate SHA-256 ${ACTUAL} ✓ (matches secrets.SIGNING_CERT_SHA256)"

          echo "── 2) tag ↔ APK ↔ 源码 版本一致 ──"
          BADGING=$("$BT/aapt2" dump badging "$APK" | head -1)
          VNAME=$(printf '%s' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VCODE=$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          if [ "v${VNAME}" != "$TAG" ]; then
            echo "::error::tag($TAG) 与 APK versionName($VNAME) 不一致"
            exit 1
          fi
          # 产物 vs 源码：防"build.gradle.kts 改了但 APK 是旧产物/缓存包"
          SRC_VNAME=$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          SRC_VCODE=$(sed -nE 's/^ *versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$SRC_VNAME" ] || [ -z "$SRC_VCODE" ]; then
            echo "::error::无法从 app/build.gradle.kts 解析 versionName/versionCode"
            exit 1
          fi
          if [ "$VNAME" != "$SRC_VNAME" ] || [ "$VCODE" != "$SRC_VCODE" ]; then
            echo "::error::APK 与源码版本不符：APK ${VNAME}/${VCODE}，源码 ${SRC_VNAME}/${SRC_VCODE}（产物不是本次源码构建的）"
            exit 1
          fi
          echo "tag=$TAG versionName=$VNAME versionCode=$VCODE = 源码 ✓"

          echo "── 3) versionCode 单调（对比上一次 Release）──"
          # 取最近的历史 Release（按 created 倒序；跳过本次 tag，兼容"发版后重跑 workflow"）
          # Fail-closed：gh/API 出错就红（重跑即可），绝不把"查询失败"当成"没有上一版"放过。
          if ! RELEASES=$(gh release list --limit 10 --json tagName --jq '.[].tagName'); then
            echo "::error::gh release list 失败，取不到上一版 versionCode —— 拒绝在无单调保证下发布，请重跑"
            exit 1
          fi
          PREV_TAG=$(printf '%s\n' "$RELEASES" | grep -vxF "$TAG" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            echo "无历史 Release（首发或仅有同 tag）→ 跳过单调检查"
          else
            if ! PREV_SRC=$(gh api "repos/${GITHUB_REPOSITORY}/contents/app/build.gradle.kts?ref=${PREV_TAG}" --jq .content); then
              echo "::error::读不到 ${PREV_TAG} 的 app/build.gradle.kts（GitHub API 失败）——拒绝在无单调保证下发布，请重跑"
              exit 1
            fi
            PREV_VCODE=$(printf '%s' "$PREV_SRC" | base64 -d 2>/dev/null \
              | sed -nE 's/^ *versionCode = ([0-9]+).*/\1/p' | head -1 || true)
            if [ -z "$PREV_VCODE" ]; then
              echo "::error::${PREV_TAG} 的 build.gradle.kts 里解析不到 versionCode（该 tag 早于 field 引入？）"
              exit 1
            fi
            if [ "$VCODE" -le "$PREV_VCODE" ]; then
              echo "::error::versionCode 未递增：本次 $VCODE ≤ 上一版 ${PREV_TAG} 的 ${PREV_VCODE}（覆盖安装会失败/更新器收不到）"
              exit 1
            fi
            echo "versionCode $VCODE > ${PREV_TAG} 的 $PREV_VCODE ✓"
          fi

          echo "── 4) 校验和 ──"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK sha256: $SHA"

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 双通道：tag 含 beta（不分大小写）即测试版 → GitHub prerelease；
          # 正式 tag（如 v2.0.17-ai）保持正式 Release。更新器正式通道只读 /latest（自动排除 prerelease）。
          if printf '%s' "$TAG" | grep -qi 'beta'; then
            PRERELEASE_FLAGS="--prerelease"
            # 坑①：bash 双引号不展开 \n —— 写死 "\n\n" 会变成字面量反斜杠 n（v2.0.11-ai 的说明里就真的这么显示了），必须用 printf。
            # 坑②：哈希由 Verify 步骤写进 $GITHUB_ENV 的 SHA256，跨步骤只能引 $SHA256，引 $SHA 永远是空串（原 bug 根因）。
            printf -v NOTES 'VibeMusic 原生版 %s（测试版，CI 自动构建签名；正式通道收不到此版）\n\nAPK sha256: `%s`' "$TAG" "$SHA256"
          else
            PRERELEASE_FLAGS=""
            printf -v NOTES 'VibeMusic 原生版 %s（CI 自动构建签名）\n\nAPK sha256: `%s`' "$TAG" "$SHA256"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" "$APK_NAME" \
              --title "$TAG" \
              --notes "$NOTES" \
              $PRERELEASE_FLAGS
          fi

      # Gitee 镜像：与 GitHub Release 同包。GitHub 是 source of truth。
      #
      # ⚠ 2026-10-27 事故：本步骤曾 `continue-on-error: true` + 结尾 `exit 0`，
      # v2.0.16-ai 镜像**静默失败**（tag push 被 shallow 拒绝 + create release
      # SSL 超时），job 仍报绿。后果：App 的更新源首选 Gitee（FIRST successful
      # wins，不做跨源版本合并），Gitee 停在 v2.0.15-ai → 用户手机永远提示
      # "已是最新版本"。故本步骤改为**失败即红**（唯一例外是未配置 token 的
      # fork：跳过属合法），并在结尾用匿名请求自证 APK 真的落地。
      - name: Mirror to Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          OWNER="green-leavesQAQ"
          REPO="vibemusic-native"
          API="https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases"
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::Gitee mirror skipped: GITEE_TOKEN secret is empty"
            exit 0
          fi
          if [ -z "${APK_NAME:-}" ] || [ ! -f "$APK_NAME" ]; then
            echo "::error::Gitee mirror failed: APK file ${APK_NAME:-<unset>} not found"
            exit 1
          fi
          NOTES="VibeMusic 原生版 $TAG（CI 自动构建签名，与 GitHub Release 同包）"
          if printf '%s' "$TAG" | grep -qi 'beta'; then
            NOTES="VibeMusic 原生版 $TAG（测试版，CI 自动构建签名，与 GitHub Release 同包）"
            PRERELEASE_JSON=',"prerelease":true'
          else
            PRERELEASE_JSON=',"prerelease":false'
          fi
          # (0) mirror the tag itself first: create-release requires the tag to
          #     exist, and the API "create tag" needs a starting ref that a
          #     fresh Gitee clone doesn't have — so push the tag (its commits
          #     ride along). Token-in-URL is masked in the log.
          #     ⚠ actions/checkout 默认 fetch-depth: 1（浅克隆），浅仓库推 tag 会被
          #     Gitee 拒绝：`! [remote rejected] (shallow update not allowed)`
          #     —— v2.0.16-ai 就是这么失败的。推之前先补全历史。
          if git rev-parse --is-shallow-repository | grep -q true; then
            echo "shallow clone detected → unshallowing before tag push"
            git fetch -q --unshallow --tags || true
          fi
          # 注意：不能写 `git push ... | sed ...`，管道的退出码是 sed 的，
          # git 失败会被吞掉（这正是 v2.0.16-ai 假绿的成因之一）。
          PUSH_LOG=$(mktemp)
          if ! git push -q "https://oauth2:${GITEE_TOKEN}@gitee.com/${OWNER}/${REPO}.git" \
              "refs/tags/${TAG}" >"$PUSH_LOG" 2>&1; then
            sed 's|oauth2:[^@]*@|oauth2:***@|g' "$PUSH_LOG"
            echo "::error::Gitee mirror failed: cannot push tag $TAG to Gitee"
            exit 1
          fi
          sed 's|oauth2:[^@]*@|oauth2:***@|g' "$PUSH_LOG"
          # (a) create release; 422 (already exists) → treat as success.
          #     带 3 次重试：runner→Gitee 的 TLS 握手会偶发超时
          #     （v2.0.16-ai 单次尝试就撞上 `curl: (28) SSL connection timeout`）。
          CREATE_CODE=""
          for attempt in 1 2 3; do
            CREATE_RESP=$(curl -sS --connect-timeout 20 --max-time 60 -w '\n%{http_code}' \
              -X POST "$API?access_token=${GITEE_TOKEN}" \
              -H "Content-Type: application/json;charset=UTF-8" \
              --data "$(TAG="$TAG" NOTES="$NOTES" PRE="$PRERELEASE_JSON" python3 -c 'import json,os;d={"tag_name":os.environ["TAG"],"name":os.environ["TAG"],"body":os.environ["NOTES"],"target_commitish":"main"};s=json.dumps(d);print(s[:-1]+os.environ["PRE"]+"}")')" \
              ) || CREATE_RESP=""
            CREATE_CODE=$(printf '%s' "$CREATE_RESP" | tail -n 1)
            echo "Gitee create HTTP: ${CREATE_CODE:-curl-failed} (attempt $attempt/3)"
            case "$CREATE_CODE" in 200|201|422) break ;; *) sleep 15 ;; esac
          done
          CREATE_BODY=$(printf '%s' "$CREATE_RESP" | sed '$d')
          RELEASE_ID=$(printf '%s' "$CREATE_BODY" | python3 -c 'import json,sys;print(json.loads(sys.stdin.read() or "{}").get("id",""))' 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            # Create returned existing (422) or no id → GET list, find id by tag.
            LIST_JSON=$(curl -sS --connect-timeout 20 --max-time 60 \
              "${API}?access_token=${GITEE_TOKEN}&per_page=100" || echo "")
            RELEASE_ID=$(printf '%s' "$LIST_JSON" | TAG="$TAG" python3 -c \
              'import json,os,sys
          try:
              items=json.loads(sys.stdin.read() or "[]")
          except Exception:
              items=[]
          tag=os.environ.get("TAG","")
          print(next((str(r.get("id","")) for r in items if r.get("tag_name")==tag), ""))' || true)
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Gitee mirror failed: no release id for tag $TAG (create HTTP ${CREATE_CODE:-?})"
            exit 1
          fi
          echo "Gitee release id: $RELEASE_ID"
          # (b) attach the SAME APK file, with retries: the 3.4MB upload
          #     over the runner→Gitee link intermittently stalls past the
          #     old 120s cap (v2.0.0-ai: curl timeout, release created but
          #     APK never attached — found only by listing assets).
          ATTACH_CODE="curl-failed"
          for attempt in 1 2 3; do
            ATTACH_CODE=$(curl -sS --connect-timeout 15 --max-time 300 -o /tmp/gitee_attach.json -w '%{http_code}' \
              -X POST "${API}/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" \
              -F "file=@${APK_NAME}" || echo "curl-failed")
            echo "Gitee attach HTTP: $ATTACH_CODE (attempt $attempt/3)"
            case "$ATTACH_CODE" in
              200|201) break ;;
              *) sleep 30 ;;
            esac
          done
          case "$ATTACH_CODE" in
            200|201) echo "Gitee attach OK: $TAG (release $RELEASE_ID)" ;;
            *)
              echo "::error::Gitee attach failed for tag $TAG after 3 attempts (HTTP $ATTACH_CODE) — GitHub release is canonical, re-attach manually"
              exit 1
              ;;
          esac

          # (c) 自证：用**匿名**请求（与 App 完全同权限）确认该 tag 的 release
          #     真的带 .apk 资产。这一条是本次事故的机器断言 —— 过去只打
          #     "mirror OK" 就 exit 0，release 建了但 APK 没挂上（v2.0.0-ai）
          #     或压根没建（v2.0.16-ai）都不会被发现。
          #     注意：查列表而非 /releases/latest —— prerelease tag 不会出现在 latest。
          VERIFY_JSON=$(curl -sS --connect-timeout 20 --max-time 60 \
            "${API}?per_page=100" || echo "")
          VERIFY=$(printf '%s' "$VERIFY_JSON" | TAG="$TAG" python3 -c '
          import json,os,sys
          try:
              items=json.loads(sys.stdin.read() or "[]")
          except Exception:
              items=[]
          tag=os.environ.get("TAG","")
          hit=next((r for r in items if r.get("tag_name")==tag), None)
          if hit is None:
              print("MISSING_RELEASE"); raise SystemExit
          apk=[a for a in (hit.get("assets") or []) if str(a.get("browser_download_url","")).lower().endswith(".apk")]
          print("OK" if apk else "MISSING_APK")
          ' 2>/dev/null || echo "VERIFY_ERROR")
          echo "Gitee verify (anonymous): $VERIFY"
          case "$VERIFY" in
            OK) echo "Gitee mirror verified: $TAG has an .apk asset" ;;
            *)
              echo "::error::Gitee mirror verification failed for $TAG: $VERIFY — App 的更新源首选 Gitee，缺这一步会导致客户端一直提示「已是最新版本」"
              exit 1
              ;;
          esac
