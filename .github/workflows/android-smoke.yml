# 编译 + 单测冒烟：验证「源码改动」还能不能编、测试还绿不绿
#
# 为什么需要它（2026-10-28 代码审查 CI-1）：
# release.yml 只在打 tag 时跑，android-smoke 原来只认工具链外围文件 —— 也就是说
# **改任何 app/src/**/*.kt 都不会触发任何 CI**，问题只在打 tag 那一刻暴露，而工作流
# 取自 tag 指向的提交，tag 打错了改不动（2026-10-27 已踩过）。本 workflow 补上
# "改源码就跑 testDebugUnitTest + assembleDebug" 这条最便宜的回路。
#
# 它不替代发版：不签名、不发 Release、不碰 Gitee、不跑 lintRelease（lint 依赖
# app/lint-baseline.xml 快照，属发版门，放在 release.yml 里一次跑完更省）。

name: android-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-smoke.yml'
      - '.github/workflows/release.yml'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'app/lint-baseline.xml'
      - 'app/src/**'
      - 'scripts/**'
      - 'gradle.properties'
  pull_request:
    paths:
      - '.github/workflows/android-smoke.yml'
      - '.github/workflows/release.yml'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'app/lint-baseline.xml'
      - 'app/src/**'
      - 'scripts/**'
      - 'gradle.properties'

# 同一分支连推两次时取消上一轮（冒烟结论只对最新提交有意义）
concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-assemble:
    runs-on: ubuntu-24.04 # 与 release.yml 一致（ubuntu-latest 自 2026-10-19 起迁 26.04）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 与 release.yml 同参：Google 已下架废弃的 tools 包，只留 platform-tools
          packages: platform-tools,platforms;android-36,build-tools;36.0.0

      - name: Grant gradlew
        run: chmod +x gradlew

      # 单文件体积守卫（CODE-REVIEW-2026-10-28 §5.2）：纯 LOC ≤250，
      # 已超标的 18 个文件进白名单并记录当前值（棘轮：只降不升）。
      # 放最前面：纯 shell + python，2 秒出结论，不用等 Gradle 起 JVM。
      - name: File size guard
        run: scripts/check-file-size.sh

      # ★ 验收门：全量单测必须全绿（与 release.yml 同一个任务，同一份真值）
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: assembleDebug
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::assembleDebug 没产出 APK"; exit 1; }
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          echo "aapt2: $AAPT2"
          "$AAPT2" dump badging "$APK" | head -2
